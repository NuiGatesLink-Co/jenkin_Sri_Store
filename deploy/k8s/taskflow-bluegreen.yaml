apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-blue
  labels:
    app: taskflow
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      color: blue
  template:
    metadata:
      labels:
        app: taskflow
        color: blue
    spec:
      containers:
      - name: app
        image: localhost:5001/taskflow-api:test
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-green
  labels:
    app: taskflow
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      color: green
  template:
    metadata:
      labels:
        app: taskflow
        color: green
    spec:
      containers:
      - name: app
        image: localhost:5001/taskflow-api:test
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow
spec:
  selector:
    color: blue
  ports:
  - port: 8080
    targetPort: 3000
